name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  shellcheck:
    name: ShellCheck (error severity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts (fail only on error-level findings)
        run: |
          set -eu
          # Style/info/warning findings don't block; genuine bugs (error severity) do.
          shellcheck --severity=error install.sh scripts/*.sh scripts/lib/*.sh tests/*.sh

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run smoke tests
        run: bash tests/smoke.sh
      - name: Check documentation counts
        run: python tests/docs.py
      - name: Check routing behavior
        run: node tests/routing.js
      - name: Check locked install and update
        run: python tests/locked-deps.py
      - name: Check dependency planning and locks
        run: python tests/dependencies.py
      - name: Check Bash updater safety
        run: bash tests/update-safety.sh
      - name: Check PowerShell updater safety
        shell: pwsh
        run: ./tests/update-safety.ps1
      - name: Check Bash skill lifecycle
        run: bash tests/update-lifecycle.sh
      - name: Check PowerShell skill lifecycle
        shell: pwsh
        run: ./tests/update-lifecycle.ps1
      - name: Compare Bash and PowerShell rendering
        shell: pwsh
        run: ./tests/rendering.ps1

  psscriptanalyzer:
    name: PSScriptAnalyzer (error severity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint PowerShell scripts (fail only on error-level findings)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $findings = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($findings) { $findings | Format-Table -AutoSize; exit 1 }
          Write-Host "No error-level findings."

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Execute Windows PowerShell regressions
        shell: powershell
        run: ./tests/windows-powershell.ps1
      - name: Compare rendering on Windows PowerShell
        shell: powershell
        run: ./tests/rendering.ps1 -Bash "C:\Program Files\Git\bin\bash.exe"
      - name: Check updater safety on Windows PowerShell
        shell: powershell
        run: ./tests/update-safety.ps1
      - name: Check skill lifecycle on Windows PowerShell
        shell: powershell
        run: ./tests/update-lifecycle.ps1
      - name: Check locked install and update on Windows
        shell: powershell
        run: python tests/locked-deps.py --bash "C:\Program Files\Git\bin\bash.exe" --powershell powershell
